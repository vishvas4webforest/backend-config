server:
  base-url: ${CONNECT_APP_BASE_URL:http://localhost:8081/connect}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST}
    port: ${DB_PORT}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:trenddb}
    hikari:
      maximum-pool-size: 2
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc: 
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  remember-expiration: ${JWT_REMEMBER_EXPIRATION}

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO

app:
  env:
    base-path: D:/git/webforest/trend-backend/trend
  log: 
    path: ${CONNECT_LOG_PATH:/home/ubuntu/webforest/logs/connect}
    
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

firebase:
  json: ${FIREBASE_JSON}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  bigQueryJson: ${FIREBASE_BIGQUERY_JSON}
  enable: ${FIREBASE_ENABLE}
  projectName: ${FIREBASE_PROJECT_NAME}

amazonProperties:
  bucketName:
    post: ${AWS_BUCKET}
    userProfile: ${AWS_BUCKET}
    oneToOneChat: ${AWS_BUCKET}
    groupChat: ${AWS_BUCKET}
    globalGroupChat: ${AWS_BUCKET} 
    groupProfile: ${AWS_BUCKET} 
    globalGroupProfile: ${AWS_BUCKET}
    globalGroupVerification: ${AWS_BUCKET}
    subGlobalGroupProfile: ${AWS_BUCKET}
    subGlobalGroupChat: ${AWS_BUCKET}
    learnToTradeChat: ${AWS_BUCKET}
    tradingEventChat: ${AWS_BUCKET}
    tradingEventProfile: ${AWS_BUCKET}
    signalGroupChat: ${AWS_BUCKET}
    signalGroupProfile: ${AWS_BUCKET} 
    userStory: ${AWS_BUCKET} 
    advertisement: ${AWS_BUCKET} 
    clip: ${AWS_BUCKET}
    commonPostComment: ${AWS_BUCKET}
    commonPostCommentCover: ${AWS_BUCKET}
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  ses:
    accessKey: ${AWS_SES_ACCESS_KEY}
    secretKey: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}

twilio:
  enabled: ${TWILIO_ENABLED}
  account-sid: ${TWILIO_ACCOUNT_ID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}              # row 95 - NEW 15 Oct; from the Twilio console, empty = plain number (no STOP handling)

connect:
  reapply:
    min-photos: ${CONNECT_REAPPLY_MIN_PHOTOS:6}
  leave-dating:
    purge-after-days: ${CONNECT_LEAVE_DATING_PURGE_AFTER_DAYS:15}
    purge-batch: ${CONNECT_LEAVE_DATING_PURGE_BATCH:200}
    purge-cron: ${CONNECT_LEAVE_DATING_PURGE_CRON:0 20 3 * * *}
  chat:
    expiry:
      days: ${CONNECT_CHAT_EXPIRY_DAYS:10}
      popup-after-days: ${CONNECT_CHAT_EXPIRY_POPUP_AFTER_DAYS:7}
      warn-before-days: ${CONNECT_WARN_BEFORE_DAYS:1}               # "Don't miss your chance to connect with <Name>." fires this many days before expiry (→ day 9)
      warn-cron: ${CONNECT_CHAT_EXPIRY_WARN_CRON:0 0 11 * * *}      # daily 11:00 server time
  we-met:
    lookback:
      days: 30
    mutual:
      days:
        threshold: 15
    popup:
      max-dismissals: 1
  re-engagement:
    enabled: true
    inactive-days: 7
    cooldown-days: 14
    batch-size: 2000
    cron: "0 0 10 * * ?"
  match:
    expiry:
      hours: ${CONNECT_MATCH_EXPIRY_HOURS:24}                     # match with no chat is deleted after this (existing 24h, now configurable)
      remind-before-hours: ${CONNECT_MATCH_EXPIRY_REMIND_BEFORE_HOURS:4}         # "Your match is waiting for you." fires this many hours before deletion
      remind-cron: "0 30 * * * *"    # hourly at :30 (ConnectMatchExpiryScheduler.remindExpiringMatches)
  new-connections:
    match:
      expiry:
        days: 10                     # existing
      expiring-soon:
        day: 9                       # existing
  credits:
    low-balance-threshold: 2
    low-balance-push:
      enabled: true
  referral:
    max-per-user: ${CONNECT_REFERRAL_MAX_PER_USER}
  travel:
    city-radius-km: ${CONNECT_TRAVEL_CITY_RADIUS_KM:50}
  location:
    stale-after-hours: ${CONNECT_LOCATION_STALE_AFTER_HOURS:12}
    require-consent: ${CONNECT_LOCATION_REQUIRE_CONSENT:false}
    min-radius-km: ${CONNECT_LOCATION_MIN_RADIUS_KM:0.25}             # row 6
  # ── checklist v3 settings (defaults shown) ──
  location-retention:
    enabled: ${CONNECT_LOCATION_RETENTION_ENABLED:true}                # rows 4, 87
    cron: ${CONNECT_LOCATION_RETENTION_CRON:0 20 * * * ?}              # rows 4, 87
    reading-hours: ${CONNECT_LOCATION_RETENTION_READING_HOURS:48}      # rows 4, 87
    encounter-days: ${CONNECT_LOCATION_RETENTION_ENCOUNTER_DAYS:30}    # rows 4, 87
    notification-hours: ${CONNECT_LOCATION_RETENTION_NOTIFICATION_HOURS:24}   # rows 4, 87
  encounter:
    pair-cooldown-days: ${CONNECT_ENCOUNTER_PAIR_COOLDOWN_DAYS:7}      # row 6
    checks-per-hour: ${CONNECT_ENCOUNTER_CHECKS_PER_HOUR:20}           # row 6
  encounter-announcement:
    enabled: ${CONNECT_ENCOUNTER_ANNOUNCEMENT_ENABLED:true}             # row 7
    delay-hours: ${CONNECT_ENCOUNTER_ANNOUNCEMENT_DELAY_HOURS:6}       # row 7
  crush-nearby:
    require-per-match-opt-in: ${CONNECT_CRUSH_NEARBY_REQUIRE_PER_MATCH_OPT_IN:false}   # row 8 - NEW 15 Oct
    delay-minutes: ${CONNECT_CRUSH_NEARBY_DELAY_MINUTES:0}
  dating-profile:
    after-acceptance: ${CONNECT_DATING_PROFILE_AFTER_ACCEPTANCE:false}  # row 21 - NEW 15 Oct
  default-mode:
    crush-nearby-enabled: ${CONNECT_DEFAULT_MODE_CRUSH_NEARBY_ENABLED:false}
  dating-consent:
    required: ${CONNECT_DATING_CONSENT_REQUIRED:false}
    
smtp:
  appleStoreImageUrl: ${APPLE_STORE_IMAGE_URL:https://apps.apple.com/app/id<YOUR_APP_ID>}
  googlePlayImageUrl: ${GOOGLE_PLAY_IMAGE_URL:https://play.google.com/store/apps/details?id=com.test.trend}

visitNow: ${VISIT_NOW:https://trendapp.uk}

social:
  facebookUrl: ${SOCIAL_FACEBOOK_URL:https://facebook.com/trendapp}
  linkedinUrl: ${SOCIAL_LINKEDIN_URL:https://linkedin.com/company/trendapp}
  instagramUrl: ${SOCIAL_INSTAGRAM_URL:https://instagram.com/trendapp}
  youtubeUrl: ${SOCIAL_YOUTUBE_URL:https://youtube.com/@trendapp}

video:
  processing-mode: ${VIDEO_PROCESSING_MODE:FFMPEG}
  job-threads: ${VIDEO_JOB_THREADS:2}
  job-queue: ${VIDEO_JOB_QUEUE:500}
  upload-threads: ${VIDEO_UPLOAD_THREADS:8}
  upload-attempts: ${VIDEO_UPLOAD_ATTEMPTS:3}
  ffmpeg-timeout-minutes: ${VIDEO_FFMPEG_TIMEOUT_MINUTES:30}
  encoder: ${VIDEO_ENCODER:libx264}
  encoder-preset: ${VIDEO_ENCODER_PRESET:veryfast}
  hls-segment-seconds: ${VIDEO_HLS_SEGMENT_SECONDS:2}
  mediaconvert:
    role-arn: ${MEDIACONVERT_ROLE_ARN:}
    region: ${MEDIACONVERT_REGION:eu-west-1}
    queue: ${MEDIACONVERT_QUEUE:}

# ════════════════════════════════════════════════════════════════════
# Checklist v3 settings. Every value is the code default.
# ════════════════════════════════════════════════════════════════════

# row 51 - metadata stripping on dating photo uploads needs ffmpeg here too
ffmpeg:
  path: ${FFMPEG_PATH:/usr/bin/ffmpeg}

moderation:
  enabled: ${MODERATION_ENABLED:true}                                  # row 48
  aws-region: ${MODERATION_AWS_REGION:eu-west-1}                       # row 48
  min-confidence: ${MODERATION_MIN_CONFIDENCE:60}                      # row 48
  flag-categories: ${MODERATION_FLAG_CATEGORIES:Explicit Nudity,Explicit,Sexual Activity,Graphic Violence,Visually Disturbing,Hate Symbols}   # row 48
  text:
    enabled: ${MODERATION_TEXT_ENABLED:true}                           # row 48
    min-score: ${MODERATION_TEXT_MIN_SCORE:0.75}                       # row 48
    flag-categories: ${MODERATION_TEXT_FLAG_CATEGORIES:SEXUAL,HATE_SPEECH,VIOLENCE_OR_THREAT,HARASSMENT_OR_ABUSE}   # row 48
  video:
    pre-check:
      enabled: ${MODERATION_VIDEO_PRE_CHECK_ENABLED:true}              # row 48
      frames: ${MODERATION_VIDEO_PRE_CHECK_FRAMES:3}                   # row 48
      timeout-seconds: ${MODERATION_VIDEO_PRE_CHECK_TIMEOUT_SECONDS:15}   # row 48
  profile-photos:
    enabled: ${MODERATION_PROFILE_PHOTOS_ENABLED:true}                 # row 49
  ban-registry:
    enabled: ${MODERATION_BAN_REGISTRY_ENABLED:true}                   # row 24
    pepper: ${MODERATION_BAN_REGISTRY_PEPPER:}                         # row 24 - SECRET: same value as the user and socket services
  # ── NEW 15 Oct (not deployed yet) ──
  report-hold:
    enabled: ${MODERATION_REPORT_HOLD_ENABLED:false}                   # row 64 - keep false
    reports: ${MODERATION_REPORT_HOLD_REPORTS:3}                       # row 64
    window-hours: ${MODERATION_REPORT_HOLD_WINDOW_HOURS:24}            # row 64
    review-hours: ${MODERATION_REPORT_HOLD_REVIEW_HOURS:24}            # row 64

media:
  metadata:
    strip:
      enabled: ${MEDIA_METADATA_STRIP_ENABLED:true}                    # row 51
    refuse-unstrippable: ${MEDIA_METADATA_REFUSE_UNSTRIPPABLE:true}    # row 51
    ffmpeg-timeout-seconds: ${MEDIA_METADATA_FFMPEG_TIMEOUT_SECONDS:120}   # row 51

interaction:
  enabled: ${INTERACTION_ENABLED:true}                                 # row 123
  record-messages: ${INTERACTION_RECORD_MESSAGES:false}                # row 123

veriff:
  enabled: ${VERIFF_ENABLED:false}
  base-url: ${VERIFF_BASE_URL:https://stationapi.veriff.com}
  api-key: ${VERIFF_API_KEY:}
  shared-secret: ${VERIFF_SHARED_SECRET:}
  callback-url: ${VERIFF_CALLBACK_URL:}
  session-reuse-days: ${VERIFF_SESSION_REUSE_DAYS:6}
  consent-text-version: ${VERIFF_CONSENT_TEXT_VERSION:id-check-biometric-v1}

signup:
  state-gate:
    enabled: ${SIGNUP_STATE_GATE_ENABLED:true}
    blocked-us-states: ${SIGNUP_BLOCKED_US_STATES:Mississippi,Tennessee,Nebraska}
