device-integrity:
  block-enabled: ${DEVICE_INTEGRITY_BLOCK_ENABLED:true}
  complaint-url: ${DEVICE_INTEGRITY_COMPLAINT_URL:https://trendapp.io/safety}
  complaint-email: ${DEVICE_INTEGRITY_COMPLAINT_EMAIL:safety@trendapp.io}

message-counting:
  enabled: ${MESSAGE_COUNTING_ENABLED:true}
  default-on-countries: ${MESSAGE_COUNTING_DEFAULT_ON:United Kingdom,GB,UK,United States,US,USA}
  ask-countries: ${MESSAGE_COUNTING_ASK:Austria,AT,Belgium,BE,Bulgaria,BG,Croatia,HR,Cyprus,CY,Czechia,Czech Republic,CZ,Denmark,DK,Estonia,EE,Finland,FI,France,FR,Germany,DE,Greece,GR,Hungary,HU,Ireland,IE,Italy,IT,Latvia,LV,Lithuania,LT,Luxembourg,LU,Malta,MT,Netherlands,The Netherlands,NL,Poland,PL,Portugal,PT,Romania,RO,Slovakia,SK,Slovenia,SI,Spain,ES,Sweden,SE,Iceland,IS,Liechtenstein,LI,Norway,NO,Switzerland,CH}
  text-version:
    popup: message-counts-popup-v1
    settings: message-counts-settings-v1

amazon-location:
  enabled: ${AMAZON_LOCATION_ENABLED:true}
  region: ${AMAZON_LOCATION_REGION:eu-west-1}

stories:
  retention:
    enabled: ${STORIES_RETENTION_ENABLED:true}
    days: ${STORIES_RETENTION_DAYS:30}
    batch: ${STORIES_RETENTION_BATCH:500}
    cron: ${STORIES_RETENTION_CRON:0 50 3 * * *}

launch:
  purge:
    enabled: ${LAUNCH_PURGE_ENABLED:false}                             # row 17
  ranking-reset:
    enabled: ${LAUNCH_RANKING_RESET_ENABLED:false}                     # row 126

analytics:
  firebase-story-sync:
    enabled: ${FIREBASE_STORY_SYNC_ENABLED:false}                      # row 34

safety:
  identical-copies:
    max-objects: ${SAFETY_IDENTICAL_COPIES_MAX_OBJECTS:2000000}        # row 58
    min-bytes: ${SAFETY_IDENTICAL_COPIES_MIN_BYTES:1024}               # row 58

counters:
  mau:
    enabled: ${COUNTERS_MAU_ENABLED:true}                              # row 77
    cron: ${COUNTERS_MAU_CRON:0 30 0 1 * *}                            # row 77

ranking:
  interest:
    half-life-days: ${RANKING_INTEREST_HALF_LIFE_DAYS:14}
    refresh-minutes: ${RANKING_INTEREST_REFRESH_MINUTES:10}
  stories:
    fresh-half-life-hours: ${RANKING_STORIES_FRESH_HALF_LIFE_HOURS:8}
    trending-first:
      count: ${RANKING_STORIES_TRENDING_FIRST_COUNT:3}
      min-score: ${RANKING_STORIES_TRENDING_FIRST_MIN_SCORE:0}
  note:
    mode: ${RANKING_NOTE_MODE:ONE_BUTTON}                              # row 102
    choice-countries: ${RANKING_NOTE_CHOICE_COUNTRIES:}                # row 118
  detector:
    provider: ${RANKING_DETECTOR_PROVIDER:NONE}                        # row 111 - NONE | REKOGNITION | PYTHON
    python:
      url: ${RANKING_DETECTOR_PYTHON_URL:}                             # row 111
      token: ${RANKING_DETECTOR_PYTHON_TOKEN:}                         # row 111
    stories: ${RANKING_DETECTOR_STORIES:false}                         # row 111
  region-rule:
    countries: ${RANKING_REGION_RULE_COUNTRIES:}                       # row 118
    us-states: ${RANKING_REGION_RULE_US_STATES:}                       # row 118
    us-states-from: ${RANKING_REGION_RULE_US_STATES_FROM:California=2027-01-01}
    delete-after-days: ${RANKING_REGION_RULE_DELETE_AFTER_DAYS:30}     # row 118

# Row 70 - terror removal orders
removal-orders:
  deadline-minutes: ${REMOVAL_ORDERS_DEADLINE_MINUTES:60}
  reminder-minutes: ${REMOVAL_ORDERS_REMINDER_MINUTES:20}
  hold-months: ${REMOVAL_ORDERS_HOLD_MONTHS:6}
  reminder-cron: ${REMOVAL_ORDERS_REMINDER_CRON:0 */5 * * * *}
  provider:
    name: ${REMOVAL_ORDERS_PROVIDER_NAME:QOQ Design Ltd, trading as Trend}
    legal-representative: ${REMOVAL_ORDERS_PROVIDER_LEGAL_REPRESENTATIVE:}
    member-state: ${REMOVAL_ORDERS_PROVIDER_MEMBER_STATE:}
    contact-email: ${REMOVAL_ORDERS_PROVIDER_CONTACT_EMAIL:legal@trendapp.io}

# Row 75 - sanctions (off by default)
sanctions:
  enabled: ${SANCTIONS_ENABLED:false}
  refusal-message: ${SANCTIONS_REFUSAL_MESSAGE:You can't publish on Trend at the moment. Contact support if you think this is a mistake.}

# Row 145 - authority export routes
authority-export:
  routes:
    uk:
      account: ${AUTHORITY_EXPORT_UK_ACCOUNT:WRITTEN_REQUEST,STATUTORY_NOTICE,COURT_ORDER,WARRANT}
      purchases: ${AUTHORITY_EXPORT_UK_PURCHASES:STATUTORY_NOTICE,COURT_ORDER,WARRANT}
      logs: ${AUTHORITY_EXPORT_UK_LOGS:STATUTORY_NOTICE,COURT_ORDER,WARRANT}
      location: ${AUTHORITY_EXPORT_UK_LOCATION:STATUTORY_NOTICE,COURT_ORDER,WARRANT}
      content: ${AUTHORITY_EXPORT_UK_CONTENT:COURT_ORDER,WARRANT}
      messages: ${AUTHORITY_EXPORT_UK_MESSAGES:COURT_ORDER,WARRANT}
    eu-eea: ${AUTHORITY_EXPORT_EU_EEA:MLA_REQUEST,DSA_ORDER_DATAREP}
    us: ${AUTHORITY_EXPORT_US:MLA_REQUEST,UK_US_DAA}
    other: ${AUTHORITY_EXPORT_OTHER:MLA_REQUEST}

ip-location:
  provider: ${IP_LOCATION_PROVIDER:DBIP}
  fallback-to-ip-api: ${IP_LOCATION_FALLBACK_TO_IP_API:true}
  dbip:
    dir: ${IP_LOCATION_DBIP_DIR:}
    auto-download: ${IP_LOCATION_DBIP_AUTO_DOWNLOAD:true}

tcap:
  enabled: ${TCAP_ENABLED:false}
  base-url: ${TCAP_BASE_URL:https://app.terrorismanalytics.org}
  username: ${TCAP_USERNAME:}
  password: ${TCAP_PASSWORD:}
  ideology: ${TCAP_IDEOLOGY:}
  pdq-confidence: ${TCAP_PDQ_CONFIDENCE:0.9}
  pdq-min-quality: ${TCAP_PDQ_MIN_QUALITY:50}
  max-file-mb: ${TCAP_MAX_FILE_MB:100}
