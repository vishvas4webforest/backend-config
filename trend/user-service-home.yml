server:
  base-url: ${USER_APP_BASE_URL:http://localhost:8081/user}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5433}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Test@123}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trenddb}
    hikari:
      maximum-pool-size: 2
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/v1/oauth2/callback/{registrationId}"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile
          apple:
            client-id: com.bigopia
            client-secret: M3A44R9956  # generated dynamically
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/v1/oauth2/callback/apple"
          linkedin:
            client-id: 78eboxtwqq091t
            client-secret: YOUR_LINKEDIN_CLIENT
            redirect-uri: "{baseUrl}/v1/oauth2/callback/linkedin"
            authorization-grant-type: authorization_code
            scope:
              - r_liteprofile
              - r_emailaddress
          facebook:
            client-id: YOUR_FACEBOOK_APP_ID
            client-secret: YOUR_FACEBOOK_APP_SECRET
            redirect-uri: "{baseUrl}/v1/oauth2/callback/facebook"
            scope:
              - email
              - public_profile
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-name-attribute: email
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/me
            user-name-attribute: id
          facebook:
            authorization-uri: https://www.facebook.com/v17.0/dialog/oauth
            token-uri: https://graph.facebook.com/v17.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  remember-expiration: ${JWT_REMEMBER_EXPIRATION}

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO

app:
  env:
    base-path: D:/git/webforest/trend-backend/trend
  log: 
    path: ${USER_LOG_PATH:D:/vishvas/logs/user}
  oauth2:
    base-url: ${USER_APP_BASE_URL}
  sso:
    error-page-url: https://yourdomain.com/error
    token-expiry-minutes: 2
  config-source: this is auth-service-home.yml
  frontend:
    email-verification-url: https://yourdomain.com/verify
    lost-phone-login-url: https://yourdomain.com/lost
    password-restore-url: https://yourdomain.com/password-restore
  lost-phone-login-token: 
    expiry-minutes: 15
    email-subject: Access your account - Lost Phone Login
  password-restore: 
    token-expiry-minutes: 30
    email-subject: Restore your password
  google:
    sign-in-redirect-url: http://localhost:8081/auth/v1/oauth2/test/google/sign-in
    sign-up-redirect-url: http://localhost:8081/auth/v1/oauth2/test/google/sign-up
  apple:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/apple/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/apple/
  linkedin:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/linkedin/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/linkedin/
  facebook:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/facebook/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/facebook/
  login-otp:
    expiry-minutes: 5
  password-reset: 
    otp-expiry-minutes: 5
    token-expiry-minutes: 30
    otp-resend-cooldown-seconds: 60
    email-subject: Reset your password
  prefix-link-for-email: ${WEBSITE_PREFIX_LINK_FOR_EMAIL:https://dev.trendapp.io/}
    
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

firebase:
  json: ${FIREBASE_JSON}
  bigQueryJson: ${FIREBASE_BIGQUERY_JSON}
  enable: ${FIREBASE_ENABLE}
  projectName: ${FIREBASE_PROJECT_NAME}

amazonProperties:
  bucketName:
    post: ${AWS_BUCKET}
    userProfile: ${AWS_BUCKET}
    oneToOneChat: ${AWS_BUCKET}
    groupChat: ${AWS_BUCKET}
    globalGroupChat: ${AWS_BUCKET}
    groupProfile: ${AWS_BUCKET}
    globalGroupProfile: ${AWS_BUCKET}
    globalGroupVerification: ${AWS_BUCKET}
    subGlobalGroupProfile: ${AWS_BUCKET} 
    subGlobalGroupChat: ${AWS_BUCKET} 
    learnToTradeChat: ${AWS_BUCKET} 
    tradingEventChat: ${AWS_BUCKET}
    tradingEventProfile: ${AWS_BUCKET}
    signalGroupChat: ${AWS_BUCKET} 
    signalGroupProfile: ${AWS_BUCKET}
    userStory: ${AWS_BUCKET} 
    advertisement: ${AWS_BUCKET} 
    clip: ${AWS_BUCKET}
    commonPostComment: ${AWS_BUCKET} 
    commonPostCommentCover: ${AWS_BUCKET}
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  ses:
    accessKey: ${AWS_SES_ACCESS_KEY}
    secretKey: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}

serviceName: ${USER_SERVICE_NAME:user}

link:
  userStoryDetailsLink: ${LINK_USER_STORY_DETAILS}
  restoreAccountLink: ${LINK_RESTORE_ACCOUNT}
  contactSupportLink: ${LINK_CONTACT_SUPPORT}

ffmpeg:
  path: ${FFMPEG_PATH}

twilio:
  enabled: ${TWILIO_ENABLED}
  account-sid: ${TWILIO_ACCOUNT_ID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

iap:
  apple:
    shared-secret: ${IAP_APPLE_SHARED_SECRET:}   # set in env or config server
    sandbox: ${IAP_APPLE_SANDBOX:false}           # true for dev/staging
  google:
    package-name: ${IAP_GOOGLE_PACKAGE_NAME:}     # e.g. com.trend.app
    service-account-json: ${IAP_GOOGLE_SA_JSON:}  # path to service-account.json

# ── STOMP broker (websockets) ─────────────────────────────
# enabled: false = in-memory broker (single instance, current behavior)
# enabled: true  = relay via RabbitMQ STOMP plugin (required for 2+ instances)
# Flip + restart the service. RabbitMQ must be running when true.
stomp:
  relay:
    enabled: ${STOMP_RELAY_ENABLED:false}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USER:guest}
    passcode: ${RABBITMQ_PASS:guest}


admin:
  invite-link-prefix: ${ADMIN_PANEL_INVITE_LINK_PREFIX:https://trend-admin-panel.onrender.com/}   # base for the set-password link; falls back to app.prefix-link-for-email
  panel-url: ${ADMIN_PANEL_URL:https://trend-admin-panel.onrender.com/}            # shown in the email as "sign in at…"
  invite:
    expiry-hours: ${ADMIN_PANEL_INVITE_EXPIRY_HOURS:72}  

smtp:
  appleStoreImageUrl: ${APPLE_STORE_IMAGE_URL:https://apps.apple.com/app/id<YOUR_APP_ID>}
  googlePlayImageUrl: ${GOOGLE_PLAY_IMAGE_URL:https://play.google.com/store/apps/details?id=com.test.trend}

visitNow: ${VISIT_NOW:https://trendapp.uk}

social:
  facebookUrl: ${SOCIAL_FACEBOOK_URL:https://facebook.com/trendapp}
  linkedinUrl: ${SOCIAL_LINKEDIN_URL:https://linkedin.com/company/trendapp}
  instagramUrl: ${SOCIAL_INSTAGRAM_URL:https://instagram.com/trendapp}
  youtubeUrl: ${SOCIAL_YOUTUBE_URL:https://youtube.com/@trendapp}

video:
  processing-mode: ${VIDEO_PROCESSING_MODE:FFMPEG}
  job-threads: ${VIDEO_JOB_THREADS:2}
  job-queue: ${VIDEO_JOB_QUEUE:500}
  upload-threads: ${VIDEO_UPLOAD_THREADS:8}
  upload-attempts: ${VIDEO_UPLOAD_ATTEMPTS:3}
  ffmpeg-timeout-minutes: ${VIDEO_FFMPEG_TIMEOUT_MINUTES:30}
  encoder: ${VIDEO_ENCODER:libx264}
  encoder-preset: ${VIDEO_ENCODER_PRESET:veryfast}
  hls-segment-seconds: ${VIDEO_HLS_SEGMENT_SECONDS:2}

moderation:
  auto-ban:
    enabled: ${MODERATION_AUTO_BAN_ENABLED:false}
    report-threshold: ${MODERATION_AUTO_BAN_REPORT_THRESHOLD:3}
  strikes:
    enabled: ${MODERATION_STRIKES_ENABLED:true}
    max: ${MODERATION_STRIKE_MAX:3}
    window-days: ${MODERATION_STRIKE_WINDOW_DAYS:0}

connect:
  chat:
    expiry:
      days: ${CONNECT_CHAT_EXPIRY_DAYS:10}
      popup-after-days: ${CONNECT_CHAT_EXPIRY_POPUP_AFTER_DAYS:7}
      warn-before-days: ${CONNECT_WARN_BEFORE_DAYS:1}               # "Don't miss your chance to connect with <Name>." fires this many days before expiry (→ day 9)
      warn-cron: ${CONNECT_CHAT_EXPIRY_WARN_CRON:0 0 11 * * *}      # daily 11:00 server time
