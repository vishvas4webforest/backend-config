twilio:
  enabled: ${TWILIO_ENABLED}
  account-sid: ${TWILIO_ACCOUNT_ID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

# ── STOMP broker (websockets) ─────────────────────────────
# enabled: false = in-memory broker (single instance, current behavior)
# enabled: true  = relay via RabbitMQ STOMP plugin (required for 2+ instances)
# Flip + restart the service. RabbitMQ must be running when true.
stomp:
  relay:
    enabled: ${STOMP_RELAY_ENABLED:false}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USER:guest}
    passcode: ${RABBITMQ_PASS:guest}

connect:
  re-engagement:
    enabled: true
    inactive-days: 7                 # no app open for N days → candidate
    cooldown-days: 14                # min gap between two nudges to the same user
    batch-size: 2000                 # max users per run
    cron: "0 0 10 * * ?"             # daily 10:00 server time (ConnectReEngagementScheduler)

visitNow: ${VISIT_NOW:https://trendapp.uk}

video:
  processing-mode: ${VIDEO_PROCESSING_MODE:FFMPEG}
  job-threads: ${VIDEO_JOB_THREADS:2}
  job-queue: ${VIDEO_JOB_QUEUE:500}
  upload-threads: ${VIDEO_UPLOAD_THREADS:8}
  upload-attempts: ${VIDEO_UPLOAD_ATTEMPTS:3}
  ffmpeg-timeout-minutes: ${VIDEO_FFMPEG_TIMEOUT_MINUTES:30}
  encoder: ${VIDEO_ENCODER:libx264}
  encoder-preset: ${VIDEO_ENCODER_PRESET:veryfast}
  hls-segment-seconds: ${VIDEO_HLS_SEGMENT_SECONDS:2}
  mediaconvert:
    role-arn: ${MEDIACONVERT_ROLE_ARN:}
    region: ${MEDIACONVERT_REGION:eu-west-1}
    queue: ${MEDIACONVERT_QUEUE:}

moderation:
  strikes:
    enabled: ${MODERATION_STRIKES_ENABLED:true}
    max: ${MODERATION_STRIKE_MAX:3}
    window-days: ${MODERATION_STRIKE_WINDOW_DAYS:0}
  # ── checklist v3 settings (already in the deployed code; defaults shown) ──
  enabled: ${MODERATION_ENABLED:true}                                  # row 48
  aws-region: ${MODERATION_AWS_REGION:eu-west-1}                       # row 48
  min-confidence: ${MODERATION_MIN_CONFIDENCE:60}                      # row 48
  flag-categories: ${MODERATION_FLAG_CATEGORIES:Explicit Nudity,Explicit,Sexual Activity,Graphic Violence,Visually Disturbing,Hate Symbols}   # row 48
  text:
    enabled: ${MODERATION_TEXT_ENABLED:true}                           # row 48
    min-score: ${MODERATION_TEXT_MIN_SCORE:0.75}                       # row 48
    flag-categories: ${MODERATION_TEXT_FLAG_CATEGORIES:SEXUAL,HATE_SPEECH,VIOLENCE_OR_THREAT,HARASSMENT_OR_ABUSE}   # row 48
    threat-hold:
      enabled: ${MODERATION_TEXT_THREAT_HOLD_ENABLED:true}             # row 60
      score: ${MODERATION_TEXT_THREAT_HOLD_SCORE:0.9}                  # row 60
  video:
    pre-check:
      enabled: ${MODERATION_VIDEO_PRE_CHECK_ENABLED:true}              # row 48
      frames: ${MODERATION_VIDEO_PRE_CHECK_FRAMES:3}                   # row 48
      timeout-seconds: ${MODERATION_VIDEO_PRE_CHECK_TIMEOUT_SECONDS:15}   # row 48
  ban-registry:
    enabled: ${MODERATION_BAN_REGISTRY_ENABLED:true}                   # row 24
    pepper: ${MODERATION_BAN_REGISTRY_PEPPER:}                         # row 24 - SECRET: same value as the user service
  report:
    first-decision-hours: ${MODERATION_REPORT_FIRST_DECISION_HOURS:24}   # row 63
  # ── NEW 15 Oct (not deployed yet) ──
  report-hold:
    enabled: ${MODERATION_REPORT_HOLD_ENABLED:false}                   # row 64 - keep false
    reports: ${MODERATION_REPORT_HOLD_REPORTS:3}                       # row 64
    window-hours: ${MODERATION_REPORT_HOLD_WINDOW_HOURS:24}            # row 64
    review-hours: ${MODERATION_REPORT_HOLD_REVIEW_HOURS:24}            # row 64

share:
  playstore-url: ${SHARE_PLAYSTORE_URL:https://play.google.com/store/apps/details?id=com.app.sftexch}
  appstore-url: ${SHARE_APPSTORE_URL:https://apps.apple.com/app/id<YOUR_APP_ID>}

chat:
  message-request:
    # true  = today's rule: a message from someone you follow goes to the inbox
    # false = the client's rule: the first message from anybody is a request
    like-instagram: ${MESSAGE_REQUEST_LIKE_INSTAGRAM:false}
    blur-media: ${CHAT_MESSAGE_REQUEST_BLUR_MEDIA:false}               # row 56 - NEW 15 Oct
  push:
    wake-app: ${CHAT_PUSH_WAKE_APP:true}
    ios-mutable-content: ${CHAT_PUSH_IOS_MUTABLE_CONTENT:true}
  read-receipts:
    enforce: ${CHAT_READ_RECEIPTS_ENFORCE:true}
    apply-to-groups: ${CHAT_READ_RECEIPTS_APPLY_TO_GROUPS:false}
  delivered-only-on-ack: ${CHAT_DELIVERED_ONLY_ON_ACK:true}
  group:
    max-members: ${GROUP_MAX_MEMBERS:256}                              # row 54
    invites-per-day: ${GROUP_INVITES_PER_DAY:50}                       # row 54
    invitation-days: ${CHAT_GROUP_INVITATION_DAYS:7}                   # row 53 - NEW 15 Oct
    invitation-expiry-cron: ${CHAT_GROUP_INVITATION_EXPIRY_CRON:0 10 * * * *}   # row 53 - NEW 15 Oct

