server:
  base-url: ${USER_APP_BASE_URL:https://apidev.trendapp.uk/user}
  forward-headers-strategy: framework  # CRITICAL: Tell Spring to trust Nginx headers

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST}
    port: ${DB_PORT}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:trenddb}
    hikari:
      maximum-pool-size: 2
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/v1/oauth2/callback/{registrationId}"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile
          apple:
            client-id: com.bigopia
            client-secret: M3A44R9956  # generated dynamically
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/v1/oauth2/callback/apple"
          linkedin:
            client-id: 78eboxtwqq091t
            client-secret: YOUR_LINKEDIN_CLIENT
            redirect-uri: "{baseUrl}/v1/oauth2/callback/linkedin"
            authorization-grant-type: authorization_code
            scope:
              - r_liteprofile
              - r_emailaddress
          facebook:
            client-id: YOUR_FACEBOOK_APP_ID
            client-secret: YOUR_FACEBOOK_APP_SECRET
            redirect-uri: "{baseUrl}/v1/oauth2/callback/facebook"
            scope:
              - email
              - public_profile
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-name-attribute: email
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/me
            user-name-attribute: id
          facebook:
            authorization-uri: https://www.facebook.com/v17.0/dialog/oauth
            token-uri: https://graph.facebook.com/v17.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  remember-expiration: ${JWT_REMEMBER_EXPIRATION}

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO

app:
  oauth2:
    base-url: ${USER_APP_BASE_URL}
  sso:
    error-page-url: https://yourdomain.com/error
    token-expiry-minutes: 2
  config-source: this is auth-service-home.yml
  frontend:
    email-verification-url: https://yourdomain.com/verify
    lost-phone-login-url: https://yourdomain.com/lost
    password-restore-url: https://yourdomain.com/password-restore
  lost-phone-login-token: 
    expiry-minutes: 15
    email-subject: Access your account - Lost Phone Login
  password-restore: 
    token-expiry-minutes: 30
    email-subject: Restore your password
  google:
    sign-in-redirect-url: http://localhost:8081/auth/v1/oauth2/test/google/sign-in
    sign-up-redirect-url: http://localhost:8081/auth/v1/oauth2/test/google/sign-up
  apple:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/apple/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/apple/
  linkedin:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/linkedin/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/linkedin/
  facebook:
    sign-in-redirect-url: https://frontend-parent.bigopia.com/auth/sign-in/facebook/
    sign-up-redirect-url: https://frontend-parent.bigopia.com/auth/sign-up/facebook/
  login-otp:
    expiry-minutes: 5
  password-reset: 
    otp-expiry-minutes: 5
    token-expiry-minutes: 30
    otp-resend-cooldown-seconds: 60
    email-subject: Reset your password
  
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

firebase:
  json: ${FIREBASE_JSON}
  bigQueryJson: ${FIREBASE_BIGQUERY_JSON}
  enable: ${FIREBASE_ENABLE}
  projectName: ${FIREBASE_PROJECT_NAME}

amazonProperties:
  bucketName:
    post: ${AWS_BUCKET}
    userProfile: ${AWS_BUCKET}
    oneToOneChat: ${AWS_BUCKET} 
    groupChat: ${AWS_BUCKET}
    globalGroupChat: ${AWS_BUCKET}
    groupProfile: ${AWS_BUCKET}
    globalGroupProfile: ${AWS_BUCKET}
    globalGroupVerification: ${AWS_BUCKET}
    subGlobalGroupProfile: ${AWS_BUCKET}
    subGlobalGroupChat: ${AWS_BUCKET}
    learnToTradeChat: ${AWS_BUCKET}
    tradingEventChat: ${AWS_BUCKET}
    tradingEventProfile: ${AWS_BUCKET}
    signalGroupChat: ${AWS_BUCKET}
    signalGroupProfile: ${AWS_BUCKET}
    userStory: ${AWS_BUCKET}
    advertisement: ${AWS_BUCKET}
    clip: ${AWS_BUCKET}
    commonPostComment: ${AWS_BUCKET}
    commonPostCommentCover: ${AWS_BUCKET}
  accessKey: ${AWS_ACCESS_KEY}
  secretKey:  ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  ses:
    accessKey: ${AWS_SES_ACCESS_KEY}
    secretKey: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}

serviceName: ${USER_SERVICE_NAME:user}

link:
  userStoryDetailsLink: ${LINK_USER_STORY_DETAILS}
  restoreAccountLink: ${LINK_RESTORE_ACCOUNT}
  contactSupportLink: ${LINK_CONTACT_SUPPORT}
