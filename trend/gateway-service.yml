server:
  port: 8081
  shutdown: graceful
 
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
    registerWithEureka: true
    fetchRegistry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
 
logging:
  level:
    # Suppress route locator debug logs
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: WARN
    org.springframework.cloud.gateway.handler: INFO
    org.springframework.cloud.gateway.filter: INFO

    # Suppress Apache HTTP client verbose logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Discovery logs
    com.netflix.discovery: WARN

    # Suppress RestTemplate logs
    org.springframework.web.client.RestTemplate: WARN

    # Hikari logs
    com.zaxxer.hikari: WARN

    # Your own app logs
    com.marketplug: INFO


 
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    loadbalancer:
    cache:
      ttl: 5s
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
              allowedOrigins: "*"
              allowedMethods: "*"
              allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-auth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/v1/auth/**,/user/v2/auth/**
          filters:
            - RewritePath=/user/(?<path>.*), /$\{path}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${AUTH_RATE_RPS:3}
                redis-rate-limiter.burstCapacity: ${AUTH_RATE_BURST:6}
                key-resolver: "#{@userKeyResolver}"
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user/(?<path>.*), /$\{path}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${API_RATE_RPS:15}
                redis-rate-limiter.burstCapacity: ${API_RATE_BURST:30}
                key-resolver: "#{@userKeyResolver}"
        - id: socket-service
          uri: lb://SOCKET-SERVICE
          predicates:
            - Path=/socket/**
          filters:
            - RewritePath=/socket/(?<path>.*), /$\{path}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${API_RATE_RPS:15}
                redis-rate-limiter.burstCapacity: ${API_RATE_BURST:30}
                key-resolver: "#{@userKeyResolver}"
        - id: connect-service
          uri: lb://CONNECT-SERVICE
          predicates:
            - Path=/connect/**
          filters:
            - RewritePath=/connect/(?<path>.*), /$\{path}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${API_RATE_RPS:15}
                redis-rate-limiter.burstCapacity: ${API_RATE_BURST:30}
                key-resolver: "#{@userKeyResolver}"
        - id: openapi
          uri: http://localhost:${server.port}
          predicates:
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs
 
springdoc:
  swagger-ui:
    urls:
      - name: user
        url: /v3/api-docs/user
      - name: socket
        url: /v3/api-docs/socket
      - name: connect
        url: /v3/api-docs/connect
