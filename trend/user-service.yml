server:
  port: 8082
  shutdown: graceful

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    registry-fetch-interval-seconds: 5
    
swagger:
  ui-path: /swagger-ui.html
  api-docs: /v3/api-docs

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    table: flyway_schema_history_user
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    prefix: classpath:/templates/mail/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 2000MB
      
app:
  registration-token:
    expiry-minutes: ${APP_REGISTRATION_TOKEN_EXPIRY_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health, info


smtp:
  from: ${SMTP_FROM:Trend <no-reply@trendapp.io>}
  contactUsEmail: ${SMTP_CONTACT_US_EMAIL:support@trendapp.io}
  supportEmail: ${SMTP_SUPPORT_EMAIL:support@trendapp.io}
  contactUsSubject: ${SMTP_CONTACT_US_SUBJECT:Contact us}
  restoreAccountEmailSubject: ${SMTP_RESTORE_ACCOUNT_SUBJECT:Account Deletion Confirmation - Restore Available}
  verifyEmailSubject: ${SMTP_VERIFY_EMAIL_SUBJECT:Verify Your Email}
  verifyEmailSuccessSubject : ${SMTP_VERIFY_EMAIL_SUCCESS_SUBJECT:Email is verified}
  forgotEmailSubject: ${SMTP_FORGOT_EMAIL_SUBJECT:Reset Your Password}
  loginAlertSubject: ${SMTP_LOGIN_ALERT_SUBJECT:New Login Detected on Your Account}
  regardsName: ${SMTP_REGARDS_NAME:Trend Team}
  headerImageUrl:  ${SMTP_HEADER_IMAGE_URL:https://sft-prod.s3.eu-west-3.amazonaws.com/sft-header.png}
  footerImageUrl: ${SMTP_FOOTER_IMAGE_URL:https://sft-prod.s3.eu-west-3.amazonaws.com/sft-footer-latest2.png}
  coverImageUrl: ${SMTP_COVER_IMAGE_URL:https://sft-prod.s3.eu-west-3.amazonaws.com/sft-cover.png}
  googlePlayImageUrl: ${SMTP_GOOGLE_PLAY_IMAGE_URL:https://play.google.com/store/apps/details?id=ch.sft.sftplatform}
  appleStoreImageUrl: ${SMTP_APPLE_STORE_IMAGE_URL:https://apps.apple.com/in/app/sft-social-trading/id1633240152}
  appLogoUrl: ${SMTP_APP_LOGO_URL:https://sft-prod.s3.eu-west-3.amazonaws.com/AppLogo.png}
  adminInviteEmailSubject: ${SMTP_ADMIN_INVITE_SUBJECT:You've been invited to the Trend Admin Panel}
  adminOtpEmailSubject: ${SMTP_ADMIN_OTP_SUBJECT:Your admin verification code}
  inactivityWarningEmailSubject: ${SMTP_INACTIVITY_WARNING_SUBJECT:Your Trend account is about to be closed}

maxSize:
  mb:
    userProfile: ${MAXSIZE_USER_PROFILE:50}
    userProfileErrorMsg: ${MAXSIZE_USER_PROFILE_ERROR:The uploaded image exceeds the maximum allowed size of 50 MB. Please upload an image within the size limit.}
    ageVerification: ${MAXSIZE_AGE_VERIFICATION:50}
    ageVerificationErrorMsg: ${MAXSIZE_AGE_VERIFICATION_ERROR:The uploaded image exceeds the maximum allowed size of 50 MB. Please upload an image within the size limit.}
    post: ${MAXSIZE_POST:50}
    postErrorMsg: ${MAXSIZE_POST_ERROR:The uploaded post exceeds the maximum allowed size of 50 MB.}
    postCover: ${MAXSIZE_POST_COVER:50}
    postCoverErrorMsg: ${MAXSIZE_POST_COVER_ERROR:The uploaded cover exceeds the maximum allowed size of 50 MB.}
    clip: ${MAXSIZE_CLIP:50}
    clipErrorMsg: ${MAXSIZE_CLIP_ERROR:The uploaded clip exceeds the maximum allowed size of 50 MB.}
    clipCover: ${MAXSIZE_CLIP_COVER:50}
    clipCoverErrorMsg: ${MAXSIZE_CLIP_COVER_ERROR:The uploaded cover exceeds the maximum allowed size of 50 MB.}
    commonPostComment: ${MAXSIZE_COMMENT:50}
    commonPostCommentErrorMsg: ${MAXSIZE_COMMENT_ERROR:The uploaded attachment exceeds the maximum allowed size of 50 MB.}
    commonPostCommentCover: ${MAXSIZE_COMMENT_COVER:50}
    commonPostCommentCoverErrorMsg: ${MAXSIZE_COMMENT_COVER_ERROR:The uploaded cover exceeds the maximum allowed size of 50 MB.}
    groupImage: ${MAXSIZE_GROUP_IMAGE:50}
    groupImageErrorMsg: ${MAXSIZE_GROUP_IMAGE_ERROR:The uploaded image exceeds the maximum allowed size of 50 MB.}
    groupMessage: ${MAXSIZE_GROUP_MESSAGE:50}
    groupMessageErrorMsg: ${MAXSIZE_GROUP_MESSAGE_ERROR:The uploaded attachment exceeds the maximum allowed size of 50 MB.}
    oneToOneChat: ${MAXSIZE_ONE_TO_ONE_CHAT:50}
    oneToOneChatErrorMsg: ${MAXSIZE_ONE_TO_ONE_CHAT_ERROR:The uploaded attachment exceeds the maximum allowed size of 50 MB.}

legal:
  terms-version: ${LEGAL_TERMS_VERSION:2026-10-01}
  terms-gate-enabled: ${LEGAL_TERMS_GATE_ENABLED:false}

consent:
  valid-months: ${CONSENT_VALID_MONTHS:3}

retention:
  enabled: ${RETENTION_ENABLED:false}          # false for first deploy — see below
  cron: ${RETENTION_CRON:0 0 3 * * *}

  viewing-history-days: ${RETENTION_VIEWING_HISTORY_DAYS:365}
  ranking-signal-days:  ${RETENTION_RANKING_SIGNAL_DAYS:365}
  analytics-days:       ${RETENTION_ANALYTICS_DAYS:426}
  report-days:          ${RETENTION_REPORT_DAYS:730}

  dm-metadata-days:     ${RETENTION_DM_METADATA_DAYS:90}
  dm-metadata-enabled:  ${RETENTION_DM_METADATA_ENABLED:false}

  inactive-account:
    enabled:           ${RETENTION_INACTIVE_ACCOUNT_ENABLED:true}
    months:            ${RETENTION_INACTIVE_ACCOUNT_MONTHS:24}
    warn-days-before:  ${RETENTION_INACTIVE_WARN_DAYS_BEFORE:30}
    batch-size:        ${RETENTION_INACTIVE_BATCH_SIZE:200}

  dormant-dating:
    enabled:       ${RETENTION_DORMANT_DATING_ENABLED:false}   # false for first deploy
    hide-months:   ${RETENTION_DORMANT_HIDE_MONTHS:6}
    delete-months: ${RETENTION_DORMANT_DELETE_MONTHS:12}
