server:
  base-url: ${CONNECT_APP_BASE_URL:https://apidev.trendapp.uk/connect}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST}
    port: ${DB_PORT}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:trenddb}
    hikari:
      maximum-pool-size: 2
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc: 
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  remember-expiration: ${JWT_REMEMBER_EXPIRATION}

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO
  
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

firebase:
  json: firebase-service-account-dev.json
  bigQueryJson: trend-ac139-f7b80bd1df0f.json
  enable: true
  projectName: Trend

amazonProperties:
  bucketName:
    post: trend-ireland-development 
    userProfile: trend-ireland-development 
    oneToOneChat: trend-ireland-development 
    groupChat: trend-ireland-development 
    globalGroupChat: trend-ireland-development 
    groupProfile: trend-ireland-development 
    globalGroupProfile: trend-ireland-development 
    globalGroupVerification: trend-ireland-development 
    subGlobalGroupProfile: trend-ireland-development 
    subGlobalGroupChat: trend-ireland-development 
    learnToTradeChat: trend-ireland-development 
    tradingEventChat: trend-ireland-development 
    tradingEventProfile: trend-ireland-development 
    signalGroupChat: trend-ireland-development 
