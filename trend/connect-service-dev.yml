server:
  base-url: ${CONNECT_APP_BASE_URL:https://apidev.trendapp.uk/connect}

twilio:
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}

connect:
  reapply:
    min-photos: ${CONNECT_REAPPLY_MIN_PHOTOS:6}
  leave-dating:
    purge-after-days: ${CONNECT_LEAVE_DATING_PURGE_AFTER_DAYS:15}
    purge-batch: ${CONNECT_LEAVE_DATING_PURGE_BATCH:200}
    purge-cron: ${CONNECT_LEAVE_DATING_PURGE_CRON:0 20 3 * * *}
  chat:
    expiry:
      days: ${CONNECT_CHAT_EXPIRY_DAYS:10}
      popup-after-days: ${CONNECT_CHAT_EXPIRY_POPUP_AFTER_DAYS:7}
      warn-before-days: ${CONNECT_WARN_BEFORE_DAYS:1}
      warn-cron: ${CONNECT_CHAT_EXPIRY_WARN_CRON:0 0 11 * * *}
  match:
    expiry:
      hours: ${CONNECT_MATCH_EXPIRY_HOURS:24}
      remind-before-hours: ${CONNECT_MATCH_EXPIRY_REMIND_BEFORE_HOURS:4}
  referral:
    max-per-user: ${CONNECT_REFERRAL_MAX_PER_USER}
  travel:
    city-radius-km: ${CONNECT_TRAVEL_CITY_RADIUS_KM:50}
  location:
    stale-after-hours: ${CONNECT_LOCATION_STALE_AFTER_HOURS:12}
    require-consent: ${CONNECT_LOCATION_REQUIRE_CONSENT:false}
    min-radius-km: ${CONNECT_LOCATION_MIN_RADIUS_KM:0.25}
    rate:
      min-interval-seconds: ${CONNECT_LOCATION_MIN_INTERVAL_SECONDS:300}
      tolerance-seconds: ${CONNECT_LOCATION_INTERVAL_TOLERANCE_SECONDS:30}
    spoof:
      max-speed-kmh: ${CONNECT_LOCATION_MAX_SPEED_KMH:1000}
      min-jump-km: ${CONNECT_LOCATION_MIN_JUMP_KM:2}
      several-devices-window-minutes: ${CONNECT_LOCATION_SEVERAL_DEVICES_WINDOW_MINUTES:5}
  location-retention:
    enabled: ${CONNECT_LOCATION_RETENTION_ENABLED:true}
    cron: ${CONNECT_LOCATION_RETENTION_CRON:0 20 * * * ?}
    reading-hours: ${CONNECT_LOCATION_RETENTION_READING_HOURS:48}
    encounter-days: ${CONNECT_LOCATION_RETENTION_ENCOUNTER_DAYS:30}
    notification-hours: ${CONNECT_LOCATION_RETENTION_NOTIFICATION_HOURS:24}
  encounter:
    pair-cooldown-days: ${CONNECT_ENCOUNTER_PAIR_COOLDOWN_DAYS:7}
    checks-per-hour: ${CONNECT_ENCOUNTER_CHECKS_PER_HOUR:20}
  encounter-announcement:
    enabled: ${CONNECT_ENCOUNTER_ANNOUNCEMENT_ENABLED:true}
    delay-hours: ${CONNECT_ENCOUNTER_ANNOUNCEMENT_DELAY_HOURS:6}
  crush-nearby:
    require-per-match-opt-in: ${CONNECT_CRUSH_NEARBY_REQUIRE_PER_MATCH_OPT_IN:false}
    delay-minutes: ${CONNECT_CRUSH_NEARBY_DELAY_MINUTES:0}
  dating-profile:
    after-acceptance: ${CONNECT_DATING_PROFILE_AFTER_ACCEPTANCE:false}
  default-mode:
    crush-nearby-enabled: ${CONNECT_DEFAULT_MODE_CRUSH_NEARBY_ENABLED:false}
  dating-consent:
    required: ${CONNECT_DATING_CONSENT_REQUIRED:false}
  id-check:
    required-for-approval: ${CONNECT_ID_CHECK_REQUIRED_FOR_APPROVAL:true}

video:
  processing-mode: ${VIDEO_PROCESSING_MODE:FFMPEG}
  mediaconvert:
    role-arn: ${MEDIACONVERT_ROLE_ARN:}

ffmpeg:
  path: ${FFMPEG_PATH:/usr/bin/ffmpeg}

moderation:
  enabled: ${MODERATION_ENABLED:true}
  aws-region: ${MODERATION_AWS_REGION:eu-west-1}
  min-confidence: ${MODERATION_MIN_CONFIDENCE:60}
  flag-categories: ${MODERATION_FLAG_CATEGORIES:Explicit Nudity,Explicit,Sexual Activity,Explicit Sexual Activity,Suggestive,Graphic Violence,Blood & Gore,Weapons,Weapon Violence,Self Harm,Visually Disturbing,Hate Symbols,Drugs,Drugs & Tobacco,Tobacco,Alcohol,Gambling}
  text:
    enabled: ${MODERATION_TEXT_ENABLED:true}
    min-score: ${MODERATION_TEXT_MIN_SCORE:0.75}
    flag-categories: ${MODERATION_TEXT_FLAG_CATEGORIES:SEXUAL,HATE_SPEECH,VIOLENCE_OR_THREAT,HARASSMENT_OR_ABUSE}
  video:
    pre-check:
      enabled: ${MODERATION_VIDEO_PRE_CHECK_ENABLED:true}
      frames: ${MODERATION_VIDEO_PRE_CHECK_FRAMES:3}
      timeout-seconds: ${MODERATION_VIDEO_PRE_CHECK_TIMEOUT_SECONDS:15}
  profile-photos:
    enabled: ${MODERATION_PROFILE_PHOTOS_ENABLED:true}
  ban-registry:
    enabled: ${MODERATION_BAN_REGISTRY_ENABLED:true}
    pepper: ${MODERATION_BAN_REGISTRY_PEPPER:}
  report-hold:
    enabled: ${MODERATION_REPORT_HOLD_ENABLED:false}
    reports: ${MODERATION_REPORT_HOLD_REPORTS:3}
    window-hours: ${MODERATION_REPORT_HOLD_WINDOW_HOURS:24}
    review-hours: ${MODERATION_REPORT_HOLD_REVIEW_HOURS:24}
  review:
    keep-days: ${MODERATION_REVIEW_KEEP_DAYS:30}
    founder-only-categories: ${MODERATION_REVIEW_FOUNDER_ONLY_CATEGORIES:}
  rules:
    policy-url: ${COMMUNITY_GUIDELINES_URL:https://trendapp.io/community-guidelines}
    support-url: ${SAFETY_SUPPORT_URL:https://trendapp.io/safety}

media:
  metadata:
    strip:
      enabled: ${MEDIA_METADATA_STRIP_ENABLED:true}
    refuse-unstrippable: ${MEDIA_METADATA_REFUSE_UNSTRIPPABLE:true}
    ffmpeg-timeout-seconds: ${MEDIA_METADATA_FFMPEG_TIMEOUT_SECONDS:120}

interaction:
  enabled: ${INTERACTION_ENABLED:true}
  record-messages: ${INTERACTION_RECORD_MESSAGES:false}

veriff:
  enabled: ${VERIFF_ENABLED:false}
  base-url: ${VERIFF_BASE_URL:https://api-saas.veriff.com}
  api-key: ${VERIFF_API_KEY:}
  shared-secret: ${VERIFF_SHARED_SECRET:}
  callback-url: ${VERIFF_CALLBACK_URL:}
  session-reuse-days: ${VERIFF_SESSION_REUSE_DAYS:6}
  consent-text-version: ${VERIFF_CONSENT_TEXT_VERSION:id-check-biometric-v1}
  consent-required: ${VERIFF_CONSENT_REQUIRED:false}
  send-date-of-birth: ${VERIFF_SEND_DATE_OF_BIRTH:true}

signup:
  state-gate:
    enabled: ${SIGNUP_STATE_GATE_ENABLED:true}
    blocked-us-states: ${SIGNUP_BLOCKED_US_STATES:Mississippi,Tennessee,Nebraska,Utah}

vendor-deletion:
  cron: ${VENDOR_DELETION_CRON:0 30 * * * *}
  max-attempts: ${VENDOR_DELETION_MAX_ATTEMPTS:10}
  batch: ${VENDOR_DELETION_BATCH:50}

encounter-preservation:
  keep-days: ${ENCOUNTER_PRESERVATION_KEEP_DAYS:365}

held-store:
  bucket: ${HELD_STORE_BUCKET:}
  region: ${HELD_STORE_REGION:eu-west-3}

ip-location:
  provider: ${IP_LOCATION_PROVIDER:DBIP}
  fallback-to-ip-api: ${IP_LOCATION_FALLBACK_TO_IP_API:true}
  dbip:
    dir: ${IP_LOCATION_DBIP_DIR:}
    auto-download: ${IP_LOCATION_DBIP_AUTO_DOWNLOAD:true}

tcap:
  enabled: ${TCAP_ENABLED:false}
  base-url: ${TCAP_BASE_URL:https://app.terrorismanalytics.org}
  username: ${TCAP_USERNAME:}
  password: ${TCAP_PASSWORD:}
  ideology: ${TCAP_IDEOLOGY:}
  pdq-confidence: ${TCAP_PDQ_CONFIDENCE:0.9}
  pdq-min-quality: ${TCAP_PDQ_MIN_QUALITY:50}
  max-file-mb: ${TCAP_MAX_FILE_MB:100}
