server:
  base-url: ${AUTH_APP_BASE_URL}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5433}   # ✅ Add this line
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Test@123}
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/acadafix
    hikari:
      maximum-pool-size: 2
  redis:
    host: localhost
    port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}           # 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # 30 days
  remember-expiration: ${JWT_REMEMBER_EXPIRATION} # 7 days

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO

app:
  oauth2:
    base-url: ${AUTH_APP_BASE_URL}
  config-source: this is auth-service-home.yml
  sso:
    error-page-url: https://yourdomain.com/error
    token-expiry-minutes: 2
  frontend:
    email-verification-url: https://yourdomain.com/verify
    lost-phone-login-url: https://yourdomain.com/lost
    password-restore-url: https://yourdomain.com/password-restore
  lost-phone-login-token: 
    expiry-minutes: 15
    email-subject: Access your account - Lost Phone Login
  password-restore: 
    token-expiry-minutes: 30
    email-subject: Restore your password
  google:
    sign-in-redirect-url: ${GOOGLE_SIGN_IN_REDIRECT_URL}
    sign-up-redirect-url: ${GOOGLE_SIGN_UP_REDIRECT_URL}
  apple:
    sign-in-redirect-url: ${APPLE_SIGN_IN_REDIRECT_URL}
    sign-up-redirect-url: ${APPLE_SIGN_UP_REDIRECT_URL}
  linkedin:
    sign-in-redirect-url: ${LINKED_IN_SIGN_IN_REDIRECT_URL}
    sign-up-redirect-url: ${LINKED_IN_SIGN_UP_REDIRECT_URL}
  facebook:
    sign-in-redirect-url: ${FACEBOOK_SIGN_IN_REDIRECT_URL}
    sign-up-redirect-url: ${FACEBOOK_IN_SIGN_UP_REDIRECT_URL}
  login-otp:
    expiry-minutes: 5
  password-reset: 
    otp-expiry-minutes: 5
    token-expiry-minutes: 30
    otp-resend-cooldown-seconds: 60
    email-subject: Reset your password
  
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

apple:
  team-id: ${APPLE_TEAM_ID}
  client-id: ${APPLE_CLIENT_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  recaptcha.secret: ${GOOGLE_SECRET}
  recaptcha.verify-url: ${GOOGLE_VERIFY_URL}
  recaptcha.threshold: ${GOOGLE_THRESHOLD:0.5}
linkedin:
  client-id: ${LINKEDIN_CLIENT_ID}
  client-secret: ${LINKEDIN_CLIENT_SECRET}
facebook:
  client-id: ${FACEBOOK_CLIENT_ID}
  client-secret: ${FACEBOOK_CLIENT_SECRET}
