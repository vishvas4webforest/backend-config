server:
  base-url: ${PAYROLL_APP_BASE_URL}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    
spring:
  datasource:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5433}   # ✅ Add this line
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Test@123}
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/acadafix
    hikari:
      maximum-pool-size: 2
  redis:
    host: localhost
    port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}           # 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # 30 days
  remember-expiration: ${JWT_REMEMBER_EXPIRATION} # 7 days

logging:
  level:
    # Keep Flyway migration logs in DEBUG (optional, useful for DB migrations)
    org.flywaydb.core: DEBUG

    # Suppress all Apache HTTP client debug logs
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

    # Suppress Eureka / Netflix Discovery verbose logs
    com.netflix.discovery: WARN

    # Suppress Spring RestTemplate HTTP DEBUG logs
    org.springframework.web.client.RestTemplate: WARN

    # Suppress Hikari connection pool debug logs
    com.zaxxer.hikari: WARN

    # Keep your own application logs at INFO
    com.acadafix: INFO

    # Suppress Spring framework debug logs
    org.springframework: INFO

app:
  oauth2:
    base-url: ${PAYROLL_APP_BASE_URL}
  sso:
    error-page-url: ${SSO_ERROR_PAGE_URL}
    token-expiry-minutes: ${SSO_TOKEN_EXPIRY_MINUES:2}
  config-source: this is payroll-service-home.yml
  
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

hmrc:
  oauth:
    token-url: ${HMRC_OAUTH_TOKEN_URL}

  client:
    id: ${HMRC_CLIENT_ID}
    secret: ${HMRC_CLIENT_SECRET}

  gateway:
    url: ${HMRC_GATEWAY_URL}

  sender:
    id: ${HMRC_SENDER_ID}
    password: ${HMRC_PASSWORD}

  product:
    code: ${HMRC_PRODUCT_CODE}

  employer:   # ✅ ADD THIS
    office-no: ${HMRC_EMPLOYER_OFFICE_NO}
    paye-ref: ${HMRC_EMPLOYER_PAY_REF}
    accounts-office-ref: ${HMRC_EMPLOYER_ACCOUNT_OFFICE_REF}

  sandbox: ${HMRC_SANDBOX:true}

  timeouts:
    connect: ${HMRC_TIMEOUT_CONNECT:30}
    read: ${HMRC_TIMEOUT_READ:60}
